# Scheduled reachability check. The address lives in the repository secret HOST and never appears in code or logs.
# If the host does not answer three times in a row the job fails, and GitHub e-mails the repository owner.
name: alive

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      ports:
        description: "Ports to try (default: 443 22). Use a closed port, e.g. 9, to rehearse a failure."
        required: false
        default: "443 22"

permissions:
  contents: write

concurrency:
  group: alive
  cancel-in-progress: true

jobs:
  alive:
    name: host is reachable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # GitHub switches scheduled workflows off after 60 days without repository activity.
      - name: keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $((30 * 86400)) ]; then
            git config user.name "uptime-bot"
            git config user.email "uptime-bot@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi

      - name: knock
        env:
          HOST: ${{ secrets.HOST }}
          PORTS: ${{ github.event.inputs.ports || '443 22' }}
        run: |
          [ -n "$HOST" ] || { echo "::error::secret HOST is not set"; exit 1; }
          for try in 1 2 3; do
            for port in $PORTS; do
              if timeout 10 bash -c "exec 3<>/dev/tcp/$HOST/$port" 2>/dev/null; then
                echo "answers (port $port, try $try)"
                exit 0
              fi
            done
            echo "try $try: no answer on ports: $PORTS"
            sleep 30
          done
          echo "::error::The host does not answer from outside. Check the hosting and restart the machine."
          exit 1
